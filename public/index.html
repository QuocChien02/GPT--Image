<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPT Image Studio</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- Màn hình đăng nhập -->
<div id="loginScreen" class="hidden">
  <div class="login-box">
    <div class="lock-icon">✦</div>
    <h2>Nhập mật khẩu để tiếp tục</h2>
    <input type="password" id="passwordInput" placeholder="Mật khẩu" />
    <button id="loginBtn">Đăng nhập</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Ứng dụng chính -->
<div id="appScreen" class="app hidden">
  <header class="app-header">
    <div class="header-text">
      <span class="brand-mark">Studio ảnh AI</span>
      <h1>GPT Image Studio</h1>
    </div>
    <button id="logoutBtn" class="hidden">Đăng xuất</button>
  </header>

  <div class="app-body">
    <!-- CỘT TRÁI: bảng điều khiển -->
    <aside class="controls">
      <div class="field">
        <label class="panel-label" for="model">Model tạo ảnh</label>
        <select id="model"></select>
        <div class="hint" id="modelHint"></div>
      </div>

      <div class="field">
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="single">1 prompt</button>
          <button class="mode-tab" data-mode="batch">Hàng loạt</button>
        </div>
      </div>

      <div class="field" id="singlePromptField">
        <label class="panel-label" for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Mô tả ảnh bạn muốn tạo..."></textarea>
      </div>

      <div class="field hidden" id="batchPromptField">
        <label class="panel-label">Danh sách prompt</label>
        <div id="promptList"></div>
        <div class="batch-actions">
          <button class="add-prompt-btn" id="addPromptBtn">+ Thêm prompt</button>
          <button class="ghost-btn" id="clearPromptsBtn">Xoá hết</button>
        </div>
        <div class="batch-summary" id="batchSummary">Chưa nhập prompt nào</div>
      </div>

      <div class="field" id="refField">
        <label class="panel-label" id="refLabel">Ảnh tham chiếu (tối đa 4, tuỳ chọn)</label>
        <div id="refDropzone">Bấm để chọn ảnh, hoặc kéo-thả vào đây</div>
        <input type="file" id="refInput" accept="image/png,image/jpeg,image/webp" multiple class="hidden" />
        <div id="refThumbs"></div>
        <div class="hint" id="refHint"></div>
      </div>

      <div class="field">
        <label class="panel-label" for="preset">Phong cách (preset)</label>
        <select id="preset"></select>
      </div>

      <div class="field">
        <label class="panel-label">Tỉ lệ khung hình</label>
        <div class="swatch-grid" id="sizeSwatches"></div>
        <div class="hint" id="sizeHint"></div>
      </div>

      <div class="row">
        <div class="field">
          <label class="panel-label" for="quality">Chất lượng</label>
          <select id="quality"></select>
        </div>
        <div class="field" id="formatField">
          <label class="panel-label" for="format">Định dạng</label>
          <select id="format"></select>
        </div>
        <div class="field">
          <label class="panel-label" for="count">Số ảnh</label>
          <select id="count"></select>
        </div>
      </div>

      <div class="field">
        <div class="cost-stat">
          <div>
            <div class="cost-main" id="costVnd">—</div>
            <div class="cost-sub" id="costUsd"></div>
          </div>
          <div class="cost-note">Số liệu tham khảo — kiểm tra giá thật trên trang OpenAI</div>
        </div>
      </div>

      <button class="primary" id="genBtn">Tạo ảnh</button>
      <button class="stop-btn hidden" id="stopBtn">■ Dừng lại</button>
      <div class="batch-progress hidden" id="batchProgress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText"></div>
      </div>
      <div class="error" id="errorBox"></div>
    </aside>

    <!-- CỘT PHẢI: kết quả -->
    <main class="results">
      <div class="results-head">
        <span class="panel-label" id="resultsLabel">Kết quả</span>
        <span class="results-count" id="resultsCount"></span>
        <div class="results-tools">
          <span class="storage-info" id="storageInfo"></span>
          <button class="ghost-btn" id="downloadAllBtn">⬇ Tải tất cả</button>
          <button class="ghost-btn" id="clearAllBtn">Xoá tất cả</button>
        </div>
      </div>
      <div class="gallery" id="gallery"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-mark">✦</div>
        <p>Ảnh bạn tạo sẽ hiện ở đây và được lưu lại trong trình duyệt.</p>
      </div>
    </main>
  </div>
</div>

<!-- Nút nổi mở chat -->
<button class="chat-fab hidden" id="chatFab" title="Trợ lý AI">
  <span id="chatFabIcon">✦</span>
</button>

<!-- Panel chat -->
<div class="chat-panel hidden" id="chatPanel">
  <div class="chat-header">
    <div>
      <div class="chat-title">Trợ lý AI</div>
      <div class="chat-subtitle">Viết prompt · hỏi đáp</div>
    </div>
    <div class="chat-header-tools">
      <button class="prompt-icon-btn" id="chatClearBtn" title="Xoá hội thoại">🗑</button>
      <button class="prompt-icon-btn" id="chatCloseBtn" title="Đóng">✕</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-area">
    <textarea id="chatInput" placeholder="Mô tả ý tưởng ảnh, hoặc hỏi bất cứ điều gì... (Enter để gửi)"></textarea>
    <button class="chat-send" id="chatSendBtn">Gửi</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Lightbox xem trước ảnh -->
<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" title="Đóng (Esc)">✕</button>
  <img id="lightboxImg" alt="Xem trước ảnh" />
  <div class="lightbox-bar">
    <span class="lightbox-info" id="lightboxInfo"></span>
    <a class="lightbox-download" id="lightboxDownload" download>⬇ Tải ảnh này</a>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
